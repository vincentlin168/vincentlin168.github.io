<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静态页面收藏 | Vincent Lin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a6bff;
            --secondary-color: #ff4a95;
            --bg-color: #f9f9ff;
            --text-color: #333;
            --card-bg: #ffffff;
            --hover-color: #e9ecff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 0;
            margin: 0;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 60px 20px;
            border-radius: 0 0 30px 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(74, 107, 255, 0.2);
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        p.subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .project-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(74, 107, 255, 0.15);
        }

        .card-header {
            padding: 20px 20px 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card-header h3 {
            font-size: 1.4rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-body {
            padding: 20px;
            flex-grow: 1;
        }

        .card-body p {
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .links-list {
            list-style: none;
        }

        .links-list li {
            margin-bottom: 12px;
        }

        .links-list a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .links-list a:hover {
            background-color: var(--hover-color);
            transform: translateX(5px);
        }

        .links-list i {
            font-size: 1.1rem;
        }

        .link-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #3a5ce0;
            box-shadow: 0 5px 15px rgba(74, 107, 255, 0.3);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
        }

        .btn-secondary:hover {
            background-color: #e03a7c;
            box-shadow: 0 5px 15px rgba(255, 74, 149, 0.3);
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 60px;
            color: #666;
            font-size: 0.9rem;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .project-grid {
                grid-template-columns: 1fr;
            }
            
            header {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-card {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .project-card:nth-child(2) {
            animation-delay: 0.1s;
        }

        .project-card:nth-child(3) {
            animation-delay: 0.2s;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-cube"></i> 我的静态页面收藏</h1>
            <p class="subtitle">这里是我存放和展示一些静态网页项目的地方</p>
        </div>
    </header>

    <div class="container">
        <div class="project-grid">
            <div class="project-card">
                <div class="card-header">
                    <h3><i class="fas fa-robot"></i> Gemini 2.5 示例页面</h3>
                </div>
                <div class="card-body">
                    <p>这是一个关于 Gemini 2.5 的演示页面，展示了其功能和特性。</p>
                    <ul class="links-list">
                        <li>
                            <a href="https://vincentlin168.github.io/Gemini2.5.html">
                                <i class="fas fa-external-link-alt"></i> 查看示例页面
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="project-card">
                <div class="card-header">
                    <h3><i class="fas fa-layer-group"></i> UI 02 项目</h3>
                </div>
                <div class="card-body">
                    <p>这是 UI 项目的第二个版本，包含了更多功能和优化。</p>
                    <ul class="links-list">
                        <li>
                            <a href="https://vincentlin168.github.io/UI%2002/">
                                <i class="fas fa-home"></i> 访问 UI 02 主页
                            </a>
                        </li>
                        <li>
                            <a href="https://vincentlin168.github.io/UI%2002/specific.html">
                                <i class="fas fa-file-code"></i> 访问特定页面
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="project-card">
                <div class="card-header">
                    <h3><i class="fas fa-code"></i> UI v0 项目</h3>
                </div>
                <div class="card-body">
                    <p>这是 UI 项目的初始版本，展示了基础设计和功能。</p>
                    <ul class="links-list">
                        <li>
                            <a href="https://vincentlin168.github.io/UI%20v0/">
                                <i class="fas fa-home"></i> 访问 UI v0 主页
                            </a>
                        </li>
                        <li>
                            <a href="https://vincentlin168.github.io/UI%20v0/another.html">
                                <i class="fas fa-file-alt"></i> 访问另一个页面
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="link-container">
            <a href="https://github.com/vincentlin168/vincentlin168.github.io" class="btn" target="_blank">
                <i class="fab fa-github"></i> 查看 GitHub 仓库
            </a>
            <button id="theme-toggle" class="btn btn-secondary">
                <i class="fas fa-moon"></i> 切换主题
            </button>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2023-2024 Vincent Lin. 保留所有权利。</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 主题切换功能
            const themeToggle = document.getElementById('theme-toggle');
            const root = document.documentElement;
            let darkMode = false;

            themeToggle.addEventListener('click', function() {
                darkMode = !darkMode;
                if (darkMode) {
                    root.style.setProperty('--primary-color', '#7c8fff');
                    root.style.setProperty('--secondary-color', '#ff7cc5');
                    root.style.setProperty('--bg-color', '#1a1a2e');
                    root.style.setProperty('--text-color', '#e6e6ff');
                    root.style.setProperty('--card-bg', '#252542');
                    root.style.setProperty('--hover-color', '#343463');
                    this.innerHTML = '<i class="fas fa-sun"></i> 切换主题';
                } else {
                    root.style.setProperty('--primary-color', '#4a6bff');
                    root.style.setProperty('--secondary-color', '#ff4a95');
                    root.style.setProperty('--bg-color', '#f9f9ff');
                    root.style.setProperty('--text-color', '#333');
                    root.style.setProperty('--card-bg', '#ffffff');
                    root.style.setProperty('--hover-color', '#e9ecff');
                    this.innerHTML = '<i class="fas fa-moon"></i> 切换主题';
                }
            });

            // 添加卡片悬停效果
            const cards = document.querySelectorAll('.project-card');
            cards.forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-10px)';
                });
                card.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0)';
                });
            });
        });
    </script>
</body>
</html>
