<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerBudget 预算管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --power-primary: #2563eb;
            --power-primary-light: #3b82f6;
            --power-primary-dark: #1d4ed8;
            --power-background: #f8fafc;
            --power-surface: #ffffff;
            --power-text: #0f172a;
            --power-text-light: #64748b;
            --power-border: #e2e8f0;
            --power-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--power-background);
            color: var(--power-text);
            overflow: hidden;
            height: 100vh;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--power-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(37, 99, 235, 0.2);
            border-radius: 50%;
            border-top-color: var(--power-primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            color: var(--power-primary);
            font-weight: 500;
        }
        
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .app-header {
            background-color: var(--power-surface);
            border-bottom: 1px solid var(--power-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
        }
        
        .logo-icon {
            font-size: 1.75rem;
            color: var(--power-primary);
            margin-right: 0.75rem;
        }
        
        .logo-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--power-text);
        }
        
        .version-info {
            font-size: 0.75rem;
            color: var(--power-text-light);
        }
        
        .app-content {
            flex: 1;
            position: relative;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .nav-buttons {
            display: flex;
            gap: 1rem;
        }
        
        .nav-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--power-border);
            background-color: var(--power-surface);
            color: var(--power-text);
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .nav-btn:hover {
            background-color: var(--power-background);
            border-color: var(--power-primary-light);
        }
        
        .nav-btn.active {
            background-color: var(--power-primary);
            color: white;
            border-color: var(--power-primary);
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载系统...</div>
    </div>
    
    <!-- App Container -->
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <i class="bi bi-bar-chart-fill logo-icon"></i>
                <span class="logo-text">PowerBudget 预算管理系统</span>
            </div>
            
            <div class="nav-buttons">
                <button class="nav-btn" id="loginBtn" onclick="navigateTo('login')">
                    <i class="bi bi-box-arrow-in-right"></i>
                    <span>登录页面</span>
                </button>
                <button class="nav-btn" id="appBtn" onclick="navigateTo('app')">
                    <i class="bi bi-grid-1x2"></i>
                    <span>主应用</span>
                </button>
            </div>
            
            <div class="version-info">
                版本 1.2.0 | 2025-03-21
            </div>
        </header>
        
        <div class="app-content">
            <iframe id="contentFrame" src="login.html" title="应用内容"></iframe>
        </div>
    </div>
    
    <script>
        // 页面加载完成后隐藏加载动画
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingOverlay = document.getElementById('loadingOverlay');
                loadingOverlay.style.opacity = '0';
                setTimeout(function() {
                    loadingOverlay.style.display = 'none';
                }, 500);
            }, 1000);
        });
        
        // 导航功能
        function navigateTo(page) {
            const frame = document.getElementById('contentFrame');
            const loginBtn = document.getElementById('loginBtn');
            const appBtn = document.getElementById('appBtn');
            
            // 移除active类
            loginBtn.classList.remove('active');
            appBtn.classList.remove('active');
            
            // 根据选择的页面导航并激活按钮
            if (page === 'login') {
                frame.src = 'login.html';
                loginBtn.classList.add('active');
            } else if (page === 'app') {
                frame.src = 'index.html';
                appBtn.classList.add('active');
            }
            
            // 显示加载动画
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.style.display = 'flex';
            loadingOverlay.style.opacity = '1';
            
            // 页面加载完成后隐藏加载动画
            frame.onload = function() {
                setTimeout(function() {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(function() {
                        loadingOverlay.style.display = 'none';
                    }, 500);
                }, 500);
            };
        }
        
        // 默认激活登录按钮
        document.getElementById('loginBtn').classList.add('active');
    </script>
</body>
</html>
