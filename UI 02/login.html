<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | PowerBudget 预算管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/login.css">
    <style>
        /* 六边形SVG动画样式 */
        .hexagon-container {
            position: absolute;
            width: 200px;
            height: 200px;
            top: 50%;
            left: 25%;
            transform: translate(-50%, -50%);
            z-index: 1;
            opacity: 0.9;
            cursor: pointer;
        }
        
        @keyframes rotateHexagon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes breathe {
            0% { opacity: 0.7; stroke-width: 2; }
            50% { opacity: 1; stroke-width: 3; }
            100% { opacity: 0.7; stroke-width: 2; }
        }
        
        @keyframes colorCycle {
            0% { stroke: rgba(37, 99, 235, 0.7); } /* 蓝色 */
            33% { stroke: rgba(16, 185, 129, 0.7); } /* 绿色 */
            66% { stroke: rgba(245, 158, 11, 0.7); } /* 橙色 */
            100% { stroke: rgba(37, 99, 235, 0.7); } /* 蓝色 */
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        .hexagon {
            animation: 
                rotateHexagon 20s linear infinite,
                breathe 4s ease-in-out infinite,
                colorCycle 15s ease-in-out infinite;
            transform-origin: center;
            fill: rgba(255, 255, 255, 0.05);
            stroke: rgba(37, 99, 235, 0.7);
            stroke-width: 2;
        }
        
        .hexagon.clicked {
            animation: spin 1s ease-out;
        }
        
        @keyframes letterPulse {
            0% { font-size: 24px; fill: #2563eb; }
            50% { font-size: 28px; fill: #1d4ed8; }
            100% { font-size: 24px; fill: #2563eb; }
        }
        
        @keyframes letterColorChange {
            0% { fill: #2563eb; } /* 蓝色 */
            33% { fill: #059669; } /* 绿色 */
            66% { fill: #d97706; } /* 橙色 */
            100% { fill: #2563eb; } /* 蓝色 */
        }
        
        .letter {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-weight: bold;
            font-size: 24px;
            fill: #2563eb;
            user-select: none;
            filter: drop-shadow(0 0 3px rgba(37, 99, 235, 0.5));
            transition: all 0.5s ease;
        }
        
        /* 每个字母有不同的脉动周期 */
        #letter-l {
            animation: 
                letterPulse 3s ease-in-out infinite,
                letterColorChange 12s ease-in-out infinite;
        }
        
        #letter-i {
            animation: 
                letterPulse 4s ease-in-out infinite,
                letterColorChange 12s ease-in-out infinite 1s;
        }
        
        #letter-n {
            animation: 
                letterPulse 5s ease-in-out infinite,
                letterColorChange 12s ease-in-out infinite 2s;
        }
        
        /* 点击时的粒子效果 */
        .particle {
            position: absolute;
            background-color: #3b82f6;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-left">
                <!-- 添加旋转的六边形SVG -->
                <div class="hexagon-container">
                    <svg width="100%" height="100%" viewBox="0 0 200 200">
                        <polygon id="hexagon" class="hexagon" points="100,20 170,60 170,140 100,180 30,140 30,60" />
                        <text id="letter-l" class="letter" x="80" y="100">L</text>
                        <text id="letter-i" class="letter" x="100" y="100">I</text>
                        <text id="letter-n" class="letter" x="120" y="100">N</text>
                    </svg>
                </div>
                
                <div class="login-content">
                    <div class="logo-container">
                        <i class="bi bi-bar-chart-fill logo-icon"></i>
                        <span class="logo-text">PowerBudget</span>
                    </div>
                    <h1>预算管理系统</h1>
                    <p class="login-subtitle">基于作业绩效管理法的战略预算系统</p>
                    
                    <div class="login-features">
                        <div class="feature-item">
                            <i class="bi bi-bullseye"></i>
                            <span>战略目标与预算关联</span>
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-graph-up-arrow"></i>
                            <span>历史数据对比分析</span>
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-check2-all"></i>
                            <span>完整审批流程追踪</span>
                        </div>
                    </div>
                    
                    <div class="system-info">
                        <p>当前版本: v1.2.0</p>
                        <p>更新日期: 2025-03-15</p>
                    </div>
                </div>
            </div>
            
            <div class="login-right">
                <div class="login-form-container">
                    <h2>欢迎登录</h2>
                    <p>请使用您的公司账号登录系统</p>
                    
                    <form id="loginForm" action="index.html" method="GET">
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <div class="input-with-icon">
                                <i class="bi bi-person"></i>
                                <input type="text" id="username" name="username" class="form-control" placeholder="请输入用户名" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">密码</label>
                            <div class="input-with-icon">
                                <i class="bi bi-lock"></i>
                                <input type="password" id="password" name="password" class="form-control" placeholder="请输入密码" required>
                                <button type="button" class="toggle-password" onclick="togglePassword()">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="remember-forgot">
                            <div class="form-check">
                                <input type="checkbox" id="remember" class="form-check-input">
                                <label for="remember" class="form-check-label">记住我</label>
                            </div>
                            <a href="#" class="forgot-link">忘记密码?</a>
                        </div>
                        
                        <div class="login-options">
                            <button type="submit" class="login-btn">登录</button>
                            
                            <div class="alternative-logins">
                                <p>或使用以下方式登录</p>
                                <div class="auth-buttons">
                                    <button type="button" class="sso-btn" title="企业单点登录">
                                        <i class="bi bi-building"></i>
                                    </button>
                                    <button type="button" class="mfa-btn" title="多因素认证">
                                        <i class="bi bi-shield-lock"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                
                <div class="login-footer">
                    <p>Copyright © 2025 PowerBudget 预算管理系统</p>
                    <div class="footer-links">
                        <a href="#">帮助</a>
                        <a href="#">隐私政策</a>
                        <a href="#">联系管理员</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // 模拟登录验证
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username && password) {
                window.location.href = 'index.html';
            }
        });

        // 字母随机移动动画
        function animateLetters() {
            const letterL = document.getElementById('letter-l');
            const letterI = document.getElementById('letter-i');
            const letterN = document.getElementById('letter-n');
            const hexagon = document.getElementById('hexagon');
            const hexSize = 200;
            const centerX = hexSize / 2;
            const centerY = hexSize / 2;
            const radius = 50; // 移动半径
            
            function getRandomPosition(centerPos, radius) {
                const angle = Math.random() * Math.PI * 2; // 随机角度
                const distance = Math.random() * radius; // 随机距离
                return centerPos + distance * Math.cos(angle);
            }
            
            function moveLetters() {
                // 随机位置，但保持在六边形内
                const newLX = getRandomPosition(centerX - 20, radius);
                const newLY = getRandomPosition(centerY, radius);
                
                const newIX = getRandomPosition(centerX, radius);
                const newIY = getRandomPosition(centerY, radius);
                
                const newNX = getRandomPosition(centerX + 20, radius);
                const newNY = getRandomPosition(centerY, radius);
                
                // 添加过渡动画
                [letterL, letterI, letterN].forEach(letter => {
                    letter.style.transition = `x ${Math.random() + 0.5}s ease, y ${Math.random() + 0.5}s ease`;
                });
                
                // 设置新位置
                letterL.setAttribute('x', newLX);
                letterL.setAttribute('y', newLY);
                
                letterI.setAttribute('x', newIX);
                letterI.setAttribute('y', newIY);
                
                letterN.setAttribute('x', newNX);
                letterN.setAttribute('y', newNY);
                
                // 每1-3秒随机移动一次
                const randomDelay = 1000 + Math.random() * 2000;
                setTimeout(moveLetters, randomDelay);
                
                // 随机改变六边形大小的微调
                const currentPoints = hexagon.getAttribute('points').split(' ');
                const scaleFactor = 0.98 + Math.random() * 0.04; // 随机比例因子
                
                const newPoints = currentPoints.map(point => {
                    const [x, y] = point.split(',').map(Number);
                    const dx = x - centerX;
                    const dy = y - centerY;
                    // 对向外的点进行微调
                    const newX = centerX + dx * scaleFactor;
                    const newY = centerY + dy * scaleFactor;
                    return `${newX},${newY}`;
                }).join(' ');
                
                hexagon.style.transition = 'all 2s ease';
                hexagon.setAttribute('points', newPoints);
            }
            
            // 开始动画
            moveLetters();
            
            // 添加鼠标悬停效果
            const svgContainer = document.querySelector('.hexagon-container svg');
            svgContainer.addEventListener('mouseover', function() {
                hexagon.style.filter = 'drop-shadow(0 0 8px rgba(37, 99, 235, 0.8))';
                [letterL, letterI, letterN].forEach(letter => {
                    letter.style.filter = 'drop-shadow(0 0 5px rgba(37, 99, 235, 0.8))';
                });
            });
            
            svgContainer.addEventListener('mouseout', function() {
                hexagon.style.filter = 'none';
                [letterL, letterI, letterN].forEach(letter => {
                    letter.style.filter = 'drop-shadow(0 0 3px rgba(37, 99, 235, 0.5))';
                });
            });
            
            // 添加点击效果
            const hexContainer = document.querySelector('.hexagon-container');
            hexContainer.addEventListener('click', function(event) {
                // 播放快速旋转动画
                hexagon.style.animation = 'none';
                setTimeout(() => {
                    hexagon.style.animation = 'rotateHexagon 20s linear infinite, breathe 4s ease-in-out infinite, colorCycle 15s ease-in-out infinite';
                }, 10);
                
                // 让字母快速散开再回来
                const letters = [letterL, letterI, letterN];
                letters.forEach((letter, index) => {
                    const angle = (index * 120) * Math.PI / 180;
                    const jumpX = centerX + Math.cos(angle) * 70;
                    const jumpY = centerY + Math.sin(angle) * 70;
                    
                    letter.style.transition = 'all 0.5s ease-out';
                    letter.setAttribute('x', jumpX);
                    letter.setAttribute('y', jumpY);
                    
                    setTimeout(() => {
                        letter.style.transition = 'all 0.3s ease-in';
                        letter.setAttribute('x', centerX + (index - 1) * 20);
                        letter.setAttribute('y', centerY);
                    }, 500);
                });
                
                // 创建粒子效果
                createParticles(event);
            });
            
            // 粒子效果函数
            function createParticles(event) {
                const container = document.querySelector('.hexagon-container');
                const rect = container.getBoundingClientRect();
                const mouseX = event.clientX - rect.left;
                const mouseY = event.clientY - rect.top;
                
                // 创建多个粒子
                for (let i = 0; i < 15; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    
                    // 随机大小
                    const size = Math.random() * 8 + 3;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    
                    // 随机颜色
                    const colors = ['#3b82f6', '#059669', '#d97706'];
                    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    // 初始位置
                    particle.style.left = `${mouseX}px`;
                    particle.style.top = `${mouseY}px`;
                    
                    container.appendChild(particle);
                    
                    // 随机方向和速度
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 60 + 30;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    
                    // 粒子动画
                    const startTime = Date.now();
                    const duration = Math.random() * 600 + 400;
                    
                    function animateParticle() {
                        const elapsed = Date.now() - startTime;
                        const progress = elapsed / duration;
                        
                        if (progress >= 1) {
                            particle.remove();
                            return;
                        }
                        
                        const x = mouseX + vx * progress;
                        const y = mouseY + vy * progress + 20 * progress * progress; // 添加重力效果
                        
                        particle.style.left = `${x}px`;
                        particle.style.top = `${y}px`;
                        particle.style.opacity = 1 - progress;
                        
                        requestAnimationFrame(animateParticle);
                    }
                    
                    requestAnimationFrame(animateParticle);
                }
            }
        }
        
        // 页面加载完成后启动动画
        document.addEventListener('DOMContentLoaded', function() {
            animateLetters();
        });
    </script>
</body>
</html>
